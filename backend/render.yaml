services:
  - type: web
    name: healthcare-companion-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PROJECT_NAME
        value: AI Healthcare Companion API
      - key: CORS_ORIGINS
        value: '["*"]'
